name: toolbox-one-prod

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:17-alpine
    restart: always
    logging: *default-logging
    env_file: .env.prod
    volumes:
      - toolbox_postgres_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: migrator
    env_file: .env.prod
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - sh
      - -c
      - cd backend/migrator && ./node_modules/.bin/prisma migrate deploy && ./node_modules/.bin/tsx prisma/seed.ts
    restart: "no"
    logging: *default-logging

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: always
    init: true
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    env_file: .env.prod
    environment:
      PORT: 3001
      HOSTNAME: 0.0.0.0
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3001/api/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 15s

  admin:
    build:
      context: .
      dockerfile: admin/Dockerfile
      args:
        BACKEND_INTERNAL_URL: http://backend:3001
    restart: always
    init: true
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    environment:
      PORT: 3000
      HOSTNAME: 0.0.0.0
      BACKEND_INTERNAL_URL: http://backend:3001
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/login"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 15s

  nginx:
    image: nginx:1.27-alpine
    restart: always
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    depends_on:
      admin:
        condition: service_healthy
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/ip-only.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 5s

volumes:
  toolbox_postgres_prod:
