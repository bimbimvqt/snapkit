<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'"><title>Snapkit Mini</title><link rel="stylesheet" href="../../../../packages/ui/focus/focus.css"><link rel="stylesheet" href="mini.css"></head><body>
<header><img src="../../assets/icon.png" alt=""><strong>Snapkit</strong><button id="pin" aria-pressed="true">Ghim</button><button id="compact" aria-label="Thu gọn">—</button><button id="close" aria-label="Đóng widget">×</button></header>
<nav id="modes" role="tablist" aria-label="Widget mode"><button id="tab-focus" role="tab" aria-controls="focus-panel" aria-selected="true" data-mode="focus">Tập trung</button><button id="tab-debug" role="tab" aria-controls="debug-panel" aria-selected="false" data-mode="debug">Debug</button><button id="tab-utility" role="tab" aria-controls="utility-panel" aria-selected="false" data-mode="utility">Tiện ích</button></nav>
<main id="focus-panel" role="tabpanel" aria-labelledby="tab-focus"><section id="task" hidden><div class="eyebrow" id="project"></div><h1 id="title"></h1><div class="criteria" id="criteria"></div><div class="track" id="track"><span id="progress"></span></div><button class="text" id="clear">Bỏ ghim task</button></section><section id="empty"><div class="eyebrow">FOCUS KIT</div><h1 id="empty-title">Một việc tại một thời điểm.</h1><p id="hint">Ghim task từ My day để theo dõi tại đây.</p></section><div class="focus focus-world" id="focus-world" data-space="forest"><span class="focus-plant" id="focus-plant" data-plant="oak" data-stage="0" aria-hidden="true"></span><div><div class="muted" id="status">Sẵn sàng tập trung</div><div id="timer" role="timer">25:00</div></div><button id="focus" class="primary">Bắt đầu</button></div><div class="mini-spaces" id="mini-spaces" role="group" aria-label="Your space"><button data-space="forest" aria-pressed="true">Rừng yên</button><button data-space="rain" aria-pressed="false">Ngày mưa</button><button data-space="cafe" aria-pressed="false">Cà phê</button><button data-space="night" aria-pressed="false">Đêm sao</button></div><button id="sound" aria-pressed="false">Âm thanh · Tắt</button><p id="garden-summary"></p><button class="open" id="open">Mở Snapkit ↗</button></main>
<main id="debug-panel" role="tabpanel" aria-labelledby="tab-debug" hidden><section><div class="eyebrow">DEBUG & BUILD</div><h1 id="debug-title">Không cần đổi cửa sổ.</h1><button class="text" id="debug-count" aria-expanded="false" aria-controls="debug-devices"></button></section><div id="debug-devices" hidden></div><div class="build quick-build"><strong id="build-title">Build nhanh</strong><div class="build-segments" id="build-platforms" role="group" aria-label="Nền tảng"><button id="build-android" aria-pressed="true">Android</button><button id="build-ios" aria-pressed="false">iOS</button></div><div class="build-segments" id="build-environments" role="group" aria-label="Môi trường"><button id="build-dev" aria-pressed="true">Dev</button><button id="build-prod" aria-pressed="false">Prod</button></div><details id="build-profile-picker"><summary id="build-profile-label"></summary><div id="build-profiles" role="group" aria-label="Build profile"></div></details><p id="build-status" role="status"></p><div id="build-artifacts" hidden></div><div class="build-actions"><button class="primary" id="build-start">Build APK</button><button id="build-cancel" hidden>Huỷ</button></div></div><div class="tool-actions"><button id="logs">Xem log</button><button id="devices">Thiết bị ↗</button></div><button class="text" id="releases">Mở Build & release ↗</button></main>
<main id="utility-panel" role="tabpanel" aria-labelledby="tab-utility" hidden><section><div class="eyebrow">DAILY KIT</div><h1 id="utility-title">Việc nhỏ, xử lý tại chỗ.</h1></section><div class="clipboard-heading"><span id="clipboard-title">Clipboard gần đây</span><span class="muted" id="clipboard-count"></span></div><div class="clipboard"><code id="clipboard-text"></code><button id="copy">Copy</button></div><button class="text" id="clipboard">Mở Clipboard Kit ↗</button><div class="tool-actions"><button id="capture">Chụp ảnh</button><button id="qr">Tạo QR</button></div><button id="awake" aria-pressed="false">Giữ máy thức · Tắt</button><p id="privacy"></p></main>
<div id="mini-bar" hidden><span id="mini-title">Focus Kit</span><strong id="mini-time">25:00</strong><button id="expand" aria-label="Mở rộng">↗</button></div><div id="feedback" role="status" hidden></div><div id="error" role="alert" hidden></div><script src="mini.js"></script></body></html>
