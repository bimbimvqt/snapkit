<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'"><title>Snapkit Mini</title><link rel="stylesheet" href="mini.css"></head><body>
<header><img src="../../assets/icon.png" alt=""><strong>Snapkit</strong><button id="pin" aria-pressed="true">Ghim</button><button id="compact" aria-label="Thu gọn">—</button><button id="close" aria-label="Đóng widget">×</button></header>
<main><section id="task" hidden><div class="eyebrow" id="project"></div><h1 id="title"></h1><div class="criteria" id="criteria"></div><div class="track" id="track"><span id="progress"></span></div><button class="text" id="clear">Bỏ ghim task</button></section><section id="empty"><div class="eyebrow">FOCUS KIT</div><h1 id="empty-title">Một việc tại một thời điểm.</h1><p id="hint">Ghim task từ My day để theo dõi tại đây.</p></section><div class="focus"><div><div class="muted" id="status">Sẵn sàng tập trung</div><div id="timer" role="timer">25:00</div></div><button id="focus" class="primary">Bắt đầu</button></div><button class="open" id="open">Mở Snapkit ↗</button></main>
<div id="mini-bar" hidden><span id="mini-title">Focus Kit</span><strong id="mini-time">25:00</strong><button id="expand" aria-label="Mở rộng">↗</button></div><div id="error" role="alert" hidden></div><script src="mini.js"></script></body></html>
