name: Build Desktop Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: mac
            arch: arm64
          - os: macos-14
            platform: mac
            arch: x64
          - os: windows-latest
            platform: win
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: npm ci
      - run: npm run check
      - name: Check desktop starts with a bundled agent
        run: npm run desktop:smoke
      - name: Package production app
        run: npm run desktop:dist -- --${{ matrix.platform }} --${{ matrix.arch }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify macOS bundle signature
        if: matrix.platform == 'mac'
        run: codesign --verify --deep --strict --verbose=2 release/mac${{ matrix.arch == 'arm64' && '-arm64' || '' }}/Snapkit.app
      - uses: actions/upload-artifact@v4
        with:
          name: snapkit-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - run: npm ci --omit=dev --ignore-scripts
      - run: python3 scripts/package-ide-extension.py release/snapkit-debug-sync.vsix
      - name: Generate content-defined delta maps
        run: node scripts/build-update-blockmaps.cjs release
      - name: Publish verified update assets and downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release
          sha256sum *.dmg *.zip *.exe *.vsix *.blockmap.json > SHA256SUMS.txt
          cd ..
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            gh release create "$GITHUB_REF_NAME" release/* --verify-tag --prerelease --title "Snapkit $GITHUB_REF_NAME" --notes-file docs/beta-release.md
          else
            gh release create "$GITHUB_REF_NAME" release/* --verify-tag --title "Snapkit $GITHUB_REF_NAME" --notes-file docs/beta-release.md
          fi
