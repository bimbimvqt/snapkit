name: Build and deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  quality-web:
    name: Verify admin and backend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Validate deployment scripts
        run: |
          bash -n scripts/github-deploy.sh scripts/production-identity.sh
          bash scripts/production-identity.sh cleanup

  quality-flutter:
    name: Verify Flutter
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.4
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  images:
    name: Build ${{ matrix.name }} image
    needs: [quality-web, quality-flutter]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: admin
            dockerfile: admin/Dockerfile
            target: runner
          - name: backend
            dockerfile: backend/Dockerfile
            target: runner
          - name: migrate
            dockerfile: backend/Dockerfile
            target: migrator
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-${{ matrix.name }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}-${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: mode=max
          sbom: true

  deploy:
    name: Deploy to 45.119.214.94
    needs: images
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.PROD_PUBLIC_URL }}
    env:
      PROD_HOST: ${{ vars.PROD_HOST }}
      PROD_PORT: ${{ vars.PROD_PORT }}
      PROD_USER: ${{ vars.PROD_USER }}
      PROD_PATH: ${{ vars.PROD_PATH }}
      PROD_PUBLIC_URL: ${{ vars.PROD_PUBLIC_URL }}
      SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
      PROD_ENV_FILE: ${{ secrets.PROD_ENV_FILE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          for variable_name in PROD_HOST PROD_PORT PROD_USER PROD_PATH PROD_PUBLIC_URL SSH_PRIVATE_KEY SSH_KNOWN_HOSTS PROD_ENV_FILE; do
            if [[ -z "${!variable_name:-}" ]]; then
              echo "Missing GitHub production configuration: $variable_name" >&2
              exit 1
            fi
          done
          [[ "$PROD_PORT" =~ ^[0-9]{1,5}$ ]] || { echo "PROD_PORT must be numeric" >&2; exit 1; }
          [[ "$PROD_USER" =~ ^[a-z_][a-z0-9_-]*$ ]] || { echo "PROD_USER is invalid" >&2; exit 1; }
          [[ "$PROD_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]] || { echo "PROD_PATH must be an absolute safe path" >&2; exit 1; }
          [[ "$PROD_PUBLIC_URL" =~ ^https?:// ]] || { echo "PROD_PUBLIC_URL must start with http:// or https://" >&2; exit 1; }

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/snapkit_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host snapkit-production
            HostName $PROD_HOST
            Port $PROD_PORT
            User $PROD_USER
            IdentityFile ~/.ssh/snapkit_deploy
            UserKnownHostsFile ~/.ssh/known_hosts
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            ConnectTimeout 15
            ConnectionAttempts 3
            ServerAliveInterval 15
            ServerAliveCountMax 4
            ControlMaster auto
            ControlPersist 15m
            ControlPath ~/.ssh/snapkit-%C
          EOF
          chmod 600 ~/.ssh/config ~/.ssh/snapkit_deploy ~/.ssh/known_hosts

          # Public port 22 receives frequent unauthenticated probes. Establish one
          # authenticated master connection and reuse it throughout this job.
          connected=false
          for attempt in 1 2 3 4 5 6; do
            if ssh -MNf snapkit-production; then
              connected=true
              break
            fi
            sleep $((attempt * 5))
          done
          [[ "$connected" == "true" ]] || { echo "Unable to establish production SSH connection" >&2; exit 1; }
          ssh -O check snapkit-production

      - name: Upload release source and production environment
        shell: bash
        run: |
          set -euo pipefail
          # PROD_PATH is validated before use and intentionally expanded locally.
          # shellcheck disable=SC2029
          ssh snapkit-production "mkdir -p '$PROD_PATH'"
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='.android-signing.env' \
            --exclude='.deployed-image-tag' \
            --exclude='node_modules/' \
            --exclude='admin/.next/' \
            --exclude='backend/.next/' \
            --exclude='app/.dart_tool/' \
            --exclude='app/build/' \
            --exclude='app/android/keystore/' \
            --exclude='backups/' \
            -e ssh \
            ./ "snapkit-production:$PROD_PATH/"
          umask 077
          printf '%s\n' "$PROD_ENV_FILE" > .env.prod.deploy
          rsync -az -e ssh \
            .env.prod.deploy "snapkit-production:$PROD_PATH/.env.prod"
          rm -f .env.prod.deploy

      - name: Authenticate server to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | ssh snapkit-production \
            "docker login ghcr.io --username '${{ github.actor }}' --password-stdin"

      - name: Deploy immutable release
        shell: bash
        run: |
          set -euo pipefail
          # Deployment values are validated and intentionally expanded locally.
          # shellcheck disable=SC2029
          ssh snapkit-production \
            "cd '$PROD_PATH' && GHCR_IMAGE_PREFIX='ghcr.io/${{ github.repository }}' IMAGE_TAG='${{ github.sha }}' PUBLIC_URL='$PROD_PUBLIC_URL' bash scripts/github-deploy.sh"

      - name: Close SSH control connection
        if: always()
        shell: bash
        run: ssh -O exit snapkit-production || true
