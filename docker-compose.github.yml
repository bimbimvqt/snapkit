services:
  migrate:
    image: ${GHCR_IMAGE_PREFIX:?GHCR_IMAGE_PREFIX is required}-migrate:${IMAGE_TAG:?IMAGE_TAG is required}

  backend:
    image: ${GHCR_IMAGE_PREFIX:?GHCR_IMAGE_PREFIX is required}-backend:${IMAGE_TAG:?IMAGE_TAG is required}

  admin:
    image: ${GHCR_IMAGE_PREFIX:?GHCR_IMAGE_PREFIX is required}-admin:${IMAGE_TAG:?IMAGE_TAG is required}

  nginx:
    ports: !reset []
    networks:
      default: {}

  edge:
    image: caddy:2.10-alpine
    restart: always
    security_opt:
      - no-new-privileges:true
    depends_on:
      nginx:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - snapkit_caddy_data:/data
      - snapkit_caddy_config:/config
    networks:
      - default
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://nginx/healthz"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 5s

volumes:
  snapkit_caddy_data:
    name: snapkit_caddy_data
  snapkit_caddy_config:
    name: snapkit_caddy_config
