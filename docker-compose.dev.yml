name: toolbox-one-dev

x-local-environment: &local-environment
  APP_ENV: development
  DATABASE_URL: postgresql://${POSTGRES_USER:-toolbox}:${POSTGRES_PASSWORD:-toolbox_dev_password}@postgres:5432/${POSTGRES_DB:-toolbox_one}?schema=public
  JWT_SECRET: ${JWT_SECRET:-development-only-secret-change-before-prod-123}
  ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@toolbox.one}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeMe123!}
  COOKIE_SECURE: "false"

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-toolbox_one}
      POSTGRES_USER: ${POSTGRES_USER:-toolbox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-toolbox_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - toolbox_postgres_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-toolbox} -d ${POSTGRES_DB:-toolbox_one}"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 5s

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: builder
    environment: *local-environment
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "pnpm -C backend db:deploy && pnpm -C backend db:seed"]
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    init: true
    restart: unless-stopped
    environment:
      <<: *local-environment
      PORT: 3001
      HOSTNAME: 0.0.0.0
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  admin:
    build:
      context: .
      dockerfile: admin/Dockerfile
      args:
        BACKEND_INTERNAL_URL: http://backend:3001
    init: true
    restart: unless-stopped
    environment:
      PORT: 3000
      HOSTNAME: 0.0.0.0
      BACKEND_INTERNAL_URL: http://backend:3001
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/login"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  toolbox_postgres_dev:
