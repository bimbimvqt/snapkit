limit_req_zone $binary_remote_addr zone=snapkit_api:10m rate=20r/s;

server {
  listen 80 default_server;
  server_name 45.119.214.94 _;
  server_tokens off;
  client_max_body_size 2m;
  keepalive_timeout 65;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location ~ ^/api/v1/media-scans/assets/[^/]+/(preview|upload/complete)$ {
    client_max_body_size 1024m;
    proxy_request_buffering off;
    limit_req zone=snapkit_api burst=40 nodelay;
    proxy_pass http://snapkit-backend-internal:3001;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30m;
    proxy_send_timeout 30m;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    limit_req zone=snapkit_api burst=40 nodelay;
    proxy_pass http://snapkit-backend-internal:3001;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # A legacy iPhone MOV can be transcoded to a browser MP4 on the first Admin
  # preview request. Keep this request alive while FFmpeg finishes, and retain
  # the same /backend/ prefix stripping used by the generic bridge below.
  location ~ ^/backend/api/admin/media-scans/assets/[^/]+/(preview|download)$ {
    limit_req zone=snapkit_api burst=40 nodelay;
    rewrite ^/backend/(.*)$ /$1 break;
    proxy_pass http://snapkit-backend-internal:3001;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30m;
    proxy_send_timeout 30m;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Same-origin bridge for admin browser requests. The trailing slash strips /backend/.
  location /backend/ {
    limit_req zone=snapkit_api burst=40 nodelay;
    proxy_pass http://snapkit-backend-internal:3001/;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://snapkit-admin-internal:3000;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
